<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fff4e0">
<title>バンちゃんからの手紙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff4e0;
    --bg-dot: #ffe6bf;
    --ink: #4a3426;
    --ink-soft: #8a6a55;
    --head: #f4f1da;
    --lid: #fbfcf2;
    --body: #f2d35b;
    --body-shade: #dcb63c;
    --belly: #f8eef0;
    --tail: #cbbfdb;
    --spot: #3a2218;
    --eye: #2e2a26;
    --coral: #ff7a6b;
    --coral-deep: #e85a4a;
    --gold: #ffcf4a;
    --card: #ffffff;
    --shadow: 0 10px 30px rgba(120, 70, 30, .18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    color: var(--ink);
    background-color: var(--bg);
    background-image: radial-gradient(var(--bg-dot) 2.5px, transparent 2.5px);
    background-size: 26px 26px;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  .app {
    position: relative;
    height: 100vh; height: 100dvh;
    max-width: 520px; margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center;
    overflow-y: auto; overflow-x: hidden;
  }
  .app.finale { justify-content: center; }
  .mute {
    position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 50;
    width: 40px; height: 40px; border-radius: 50%;
    border: none; background: rgba(255,255,255,.8); box-shadow: var(--shadow);
    font-size: 18px; cursor: pointer;
  }

  /* ---------- 封筒（最初の画面） ---------- */
  .envelope-screen {
    position: absolute; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    background: var(--bg);
    background-image: radial-gradient(var(--bg-dot) 2.5px, transparent 2.5px);
    background-size: 26px 26px;
    transition: opacity .6s, transform .6s;
  }
  .envelope-screen.gone { opacity: 0; transform: scale(1.08); pointer-events: none; }
  .envelope {
    position: relative; width: 240px; height: 160px; cursor: pointer;
    animation: wobble 2.4s ease-in-out infinite;
  }
  .envelope .body {
    position: absolute; inset: 0; border-radius: 14px;
    background: linear-gradient(160deg, #fff 0%, #fff6e8 100%);
    box-shadow: var(--shadow);
  }
  .envelope .flap {
    position: absolute; left: 0; right: 0; top: 0; height: 100px;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    background: linear-gradient(180deg, #ffe0b0, #ffd08a);
    border-radius: 14px 14px 0 0;
    transform-origin: top; transition: transform .5s;
  }
  .envelope.open .flap { transform: rotateX(180deg); }
  .envelope .seal {
    position: absolute; left: 50%; top: 78px; transform: translate(-50%, -50%);
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--coral); color: #fff; font-size: 26px;
    display: grid; place-items: center; box-shadow: 0 4px 10px rgba(232,90,74,.4);
  }
  .envelope-label { text-align: center; line-height: 1.7; }
  .envelope-label .from { font-size: 14px; color: var(--ink-soft); }
  .envelope-label .tap { font-size: 20px; font-weight: 900; }
  .envelope-label .tap span { display: inline-block; animation: blink 1.4s ease-in-out infinite; }
  @keyframes wobble { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg) translateY(-6px); } }
  @keyframes blink { 50% { opacity: .35; } }

  /* ---------- 舞台 ---------- */
  .stage-label {
    margin-top: 4px; font-size: 12px; letter-spacing: .2em; color: var(--ink-soft);
    display: flex; gap: 6px;
  }
  .stage-label i { width: 8px; height: 8px; border-radius: 50%; background: #e9d2b0; transition: background .3s; }
  .stage-label i.on { background: var(--coral); }

  .gecko-wrap {
    flex: 1 1 auto; min-height: 0; width: 100%;
    display: flex; align-items: flex-end; justify-content: center;
    padding-top: 30px;
  }
  /* 本物のバンちゃんの写真を、表情ごとに動かす */
  .photo {
    --size: min(72vw, 300px, 38dvh);
    position: relative; width: var(--size); height: var(--size);
    animation: pop-in .5s cubic-bezier(.2,1.4,.4,1) both;
  }
  .frame {
    position: absolute; inset: 0; overflow: hidden;
    border-radius: 28px; border: 6px solid #fff;
    background: #fff; box-shadow: var(--shadow);
  }
  .frame > img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity .35s;
    animation: drift 9s ease-in-out infinite alternate;
  }
  .photo[data-face="haughty"] .shot-haughty,
  .photo[data-face="proud"] .shot-proud,
  .photo[data-face="smug"] .shot-smug,
  .photo[data-face="shy"] .shot-shy,
  .photo[data-face="happy"] .shot-happy { opacity: 1; }
  /* 絵はゆっくり寄って、生きているように見せる */
  @keyframes drift { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.06) translate(-1%, -1%); } }

  /* 表情ごとの体の動き */
  .photo[data-face="haughty"] .frame { transform: rotate(-2deg); }
  .photo[data-face="smug"] .frame   { animation: puff 1.8s ease-in-out infinite; }
  .photo[data-face="proud"] .frame  { animation: puff 1.4s ease-in-out infinite; }
  .photo[data-face="shy"] .frame    { animation: sway 2.2s ease-in-out infinite; }
  .photo[data-face="happy"] .frame  { animation: hop .7s ease-in-out infinite; }
  @keyframes puff { 0%,100% { transform: rotate(1.5deg) scale(1); } 50% { transform: rotate(1.5deg) scale(1.035); } }
  @keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg) translateX(3px); } }
  @keyframes hop  { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-10px) rotate(1deg); } }
  @keyframes pop-in { from { transform: scale(.85) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .photo.pop { animation: pop-in .45s cubic-bezier(.2,1.4,.4,1) both; }

  /* 漫画の効果（表情ごとに出し分け） */
  .fx { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
  .fx > * { position: absolute; display: none; }
  .photo[data-face="haughty"] .fx-haughty,
  .photo[data-face="proud"] .fx-proud,
  .photo[data-face="smug"] .fx-smug,
  .photo[data-face="shy"] .fx-shy,
  .photo[data-face="happy"] .fx-happy { display: block; }
  .say {
    font-weight: 900; color: var(--coral-deep); white-space: nowrap;
    -webkit-text-stroke: 6px #fff; paint-order: stroke fill;
    text-shadow: 0 3px 0 rgba(120,70,30,.15);
    animation: stamp .5s cubic-bezier(.2,1.6,.4,1) .25s both;
  }
  @keyframes stamp { from { transform: scale(2.2) rotate(var(--r, 0deg)); opacity: 0; } to { transform: scale(1) rotate(var(--r, 0deg)); opacity: 1; } }
  .fx-haughty.say { right: -18px; top: -14px; font-size: 30px; --r: 10deg; }
  .fx-proud.say   { left: -16px; top: -6px; font-size: 28px; --r: -10deg; color: #c9871a; }
  .fx-smug.say    { left: -16px; top: -6px; font-size: 30px; --r: -10deg; color: #c9871a; }
  .fx-shy.say     { right: -14px; bottom: 18px; font-size: 22px; --r: 8deg; color: #e86a8a; }
  .fx-happy.say   { right: -14px; bottom: 14px; font-size: 26px; --r: -8deg; }
  .fx svg { overflow: visible; }
  .huff { right: 8px; top: 36px; width: 46px; animation: huff-lines 1.4s ease-out infinite; }
  @keyframes huff-lines { 0% { opacity: 0; transform: translateX(-6px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateX(6px); } }
  .twinkle { width: 30px; animation: twinkle 1.2s ease-in-out infinite; }
  .twinkle.t1 { right: -12px; top: 30%; } .twinkle.t2 { right: 18%; top: -16px; width: 22px; animation-delay: .4s; }
  .twinkle.t3 { left: -14px; bottom: 22%; width: 24px; animation-delay: .8s; }
  @keyframes twinkle { 0%,100% { transform: scale(.4) rotate(0deg); opacity: .2; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }
  .drop { right: -6px; top: -18px; width: 26px; animation: drip 1.8s ease-in-out infinite; }
  @keyframes drip { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
  .blush-mark { left: -18px; top: 26%; width: 40px; animation: drip 1.6s ease-in-out infinite; }
  .float { bottom: 10%; width: 26px; animation: rise-up 2.4s ease-in infinite; }
  .float.f1 { left: -14px; } .float.f2 { right: -12px; animation-delay: .8s; width: 22px; } .float.f3 { right: 30%; animation-delay: 1.6s; width: 18px; }
  @keyframes rise-up { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-190px) scale(1.1); opacity: 0; } }

  .bubble {
    position: relative; width: 100%; margin-top: 14px;
    background: var(--card); border-radius: 22px; box-shadow: var(--shadow);
    padding: 26px 20px 20px; min-height: 172px;
    font-size: 17px; line-height: 1.85; font-weight: 500;
    cursor: pointer;
  }
  .bubble::before {
    content: ""; position: absolute; top: -12px; left: 50%; margin-left: -12px;
    border: 12px solid transparent; border-top: 0; border-bottom-color: var(--card);
  }
  .bubble .name {
    position: absolute; top: -14px; left: 18px;
    background: var(--coral); color: #fff; font-weight: 900; font-size: 13px;
    padding: 4px 12px; border-radius: 999px; letter-spacing: .08em;
  }
  .bubble .text { white-space: pre-wrap; word-break: break-all; }
  .bubble .caret { display: inline-block; width: 2px; height: 1em; background: var(--ink); vertical-align: -2px; margin-left: 2px; animation: blink .8s steps(1) infinite; }
  .bubble .more { position: absolute; right: 16px; bottom: 8px; font-size: 12px; color: var(--ink-soft); opacity: 0; transition: opacity .3s; }
  .bubble.typing .more { opacity: 1; }

  .actions {
    width: 100%; min-height: 76px; margin-top: 16px;
    display: flex; flex-direction: column; align-items: stretch; gap: 12px;
  }
  .btn {
    font: inherit; font-weight: 900; font-size: 18px; color: #fff;
    border: none; border-radius: 999px; padding: 18px 20px; cursor: pointer;
    background: linear-gradient(180deg, var(--coral), var(--coral-deep));
    box-shadow: 0 6px 0 #c4483a, var(--shadow);
    transition: transform .08s, box-shadow .08s;
    animation: rise .45s cubic-bezier(.2,1.4,.4,1) both;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c4483a, var(--shadow); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.95); } to { opacity: 1; transform: none; } }

  .mission {
    background: #fffbe9; border: 2.5px dashed var(--body-shade); border-radius: 18px;
    padding: 14px 16px; font-size: 15px; line-height: 1.7;
    animation: rise .45s cubic-bezier(.2,1.4,.4,1) both;
  }
  .mission b { display: block; font-size: 13px; letter-spacing: .15em; color: var(--coral-deep); margin-bottom: 2px; }
  .mission small { color: var(--ink-soft); }

  .summon {
    position: relative; overflow: hidden;
    font-size: 21px; padding: 24px 20px;
    background: linear-gradient(120deg, #8a5cff, #ff5fb2 50%, #ffb347);
    background-size: 200% 200%;
    box-shadow: 0 6px 0 #6b3fd6, 0 0 0 0 rgba(255,95,178,.6), var(--shadow);
    animation: rise .5s cubic-bezier(.2,1.4,.4,1) both, shimmer 3s linear infinite, glow 1.6s ease-in-out infinite;
  }
  .summon::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent);
    transform: skewX(-20deg); animation: shine 2.2s ease-in-out infinite;
  }
  .summon:active { box-shadow: 0 2px 0 #6b3fd6, var(--shadow); }
  @keyframes shimmer { to { background-position: 200% 0; } }
  @keyframes glow { 50% { box-shadow: 0 6px 0 #6b3fd6, 0 0 0 14px rgba(255,95,178,0), 0 0 40px rgba(255,140,200,.9); } }
  @keyframes shine { 0% { left: -60%; } 60%,100% { left: 130%; } }

  .replay {
    margin-top: 6px; align-self: center; background: none; border: none; font: inherit;
    font-size: 13px; color: var(--ink-soft); text-decoration: underline; cursor: pointer;
  }

  /* ---------- 召喚の演出 ---------- */
  .summon-layer {
    position: fixed; inset: 0; z-index: 30; pointer-events: none;
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 50%, rgba(40,10,70,.75), rgba(10,0,25,.96));
    opacity: 0; transition: opacity .5s;
  }
  .summon-layer.on { opacity: 1; pointer-events: auto; }
  .circle { width: min(86vw, 420px); height: auto; transform: scale(.2) rotate(0deg); opacity: 0;
    filter: drop-shadow(0 0 8px #ffe08a) drop-shadow(0 0 22px #ff7ad9); }
  .summon-layer.on .circle { animation: circle-in 3.8s cubic-bezier(.3,.0,.2,1) forwards; }
  .circle .spin-a { transform-origin: 0 0; animation: spin 6s linear infinite; }
  .circle .spin-b { transform-origin: 0 0; animation: spin 4s linear infinite reverse; }
  @keyframes circle-in {
    0% { opacity: 0; transform: scale(.2) rotate(-90deg); }
    25% { opacity: 1; }
    100% { opacity: 1; transform: scale(1.05) rotate(180deg); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .chant {
    position: absolute; bottom: 18%; left: 0; right: 0; text-align: center;
    color: #fff; font-weight: 900; font-size: 20px; letter-spacing: .25em;
    text-shadow: 0 0 12px #ff7ad9;
  }
  .shake { animation: shake .12s linear infinite; }
  @keyframes shake { 25% { transform: translate(2px,-1px); } 50% { transform: translate(-2px,1px); } 75% { transform: translate(1px,2px); } }
  .flash { position: fixed; inset: 0; z-index: 40; background: #fff; opacity: 0; pointer-events: none; }
  .flash.go { animation: flash 1.4s ease-out forwards; }
  @keyframes flash { 0% { opacity: 0; background: #fff; } 6% { opacity: 1; background: #fff; } 22% { opacity: .9; background: #ffd6f0; } 100% { opacity: 0; background: #ffe9a8; } }
  .shake-hard { animation: shake-hard .08s linear infinite; }
  @keyframes shake-hard { 25% { transform: translate(5px,-3px) rotate(.4deg); } 50% { transform: translate(-5px,3px); } 75% { transform: translate(3px,5px) rotate(-.4deg); } }

  /* 召喚：回る光の筋、中心で育つ光の玉、最後の衝撃波と光の柱 */
  .rays { position: absolute; left: 50%; top: 50%; width: 220vmax; height: 220vmax; margin: -110vmax 0 0 -110vmax;
    background: repeating-conic-gradient(from 0deg, rgba(255,230,150,.22) 0deg 6deg, transparent 6deg 18deg);
    opacity: 0; animation: spin 7s linear infinite; }
  .summon-layer.on .rays { animation: spin 7s linear infinite, rays-in 3.8s ease-in forwards; }
  @keyframes rays-in { from { opacity: 0; } to { opacity: 1; } }
  .summon-layer.on { animation: hue 1.2s linear infinite; }
  @keyframes hue { 0%,100% { background-color: rgba(60,0,90,.2); } 50% { background-color: rgba(120,0,90,.25); } }
  .orb { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #fff6c8 25%, rgba(255,140,220,.8) 50%, rgba(255,140,220,0) 72%);
    transform: scale(0); }
  .summon-layer.on .orb { animation: orb-grow 3.8s cubic-bezier(.6,0,.9,.6) forwards, orb-pulse .25s ease-in-out infinite alternate; }
  @keyframes orb-grow { from { transform: scale(0); } to { transform: scale(2.6); } }
  @keyframes orb-pulse { from { filter: brightness(1); } to { filter: brightness(1.5); } }
  .burst { position: fixed; inset: 0; z-index: 41; pointer-events: none; display: grid; place-items: center; }
  .burst .wave { position: absolute; left: 50%; top: 50%; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%;
    border: 10px solid #fff; box-shadow: 0 0 30px #ff9be6, inset 0 0 30px #ffe08a; opacity: 0; }
  .burst.go .wave { animation: wave 1.1s cubic-bezier(.1,.6,.3,1) forwards; }
  .burst.go .wave:nth-child(2) { animation-delay: .15s; border-color: #ffe08a; }
  .burst.go .wave:nth-child(3) { animation-delay: .3s; border-color: #9fe3ff; }
  @keyframes wave { 0% { transform: scale(.2); opacity: 1; } 100% { transform: scale(14); opacity: 0; border-width: 2px; } }
  .burst .pillar { position: absolute; left: 50%; top: 0; bottom: 0; width: 160px; margin-left: -80px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.95) 40%, #fff 50%, rgba(255,255,255,.95) 60%, transparent);
    transform: scaleX(0); opacity: 0; }
  .burst.go .pillar { animation: pillar 1.3s ease-out forwards; }
  @keyframes pillar { 0% { transform: scaleX(0); opacity: 1; } 20% { transform: scaleX(1.4); opacity: 1; } 100% { transform: scaleX(3); opacity: 0; } }
  .burst .stamp { position: relative; font-weight: 900; font-size: clamp(40px, 13vw, 64px); letter-spacing: .04em; white-space: nowrap;
    background: linear-gradient(90deg, #ff5fb2, #ff9a3c, #ffcf4a, #7ad37a, #5fb8ff, #a77bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 2px #fff) drop-shadow(0 4px 10px rgba(255,120,200,.7));
    opacity: 0; }
  .burst.go .stamp { animation: stamp-big 2.2s cubic-bezier(.2,1.6,.4,1) .1s forwards; }
  @keyframes stamp-big { 0% { transform: scale(3) rotate(-8deg); opacity: 0; } 18% { transform: scale(1) rotate(-4deg); opacity: 1; }
    75% { transform: scale(1.06) rotate(-4deg); opacity: 1; } 100% { transform: scale(1.4) rotate(-4deg); opacity: 0; } }

  /* ---------- フィナーレ ---------- */
  .finale-title {
    display: none; text-align: center; margin-top: 6px;
    font-weight: 900; line-height: 1.25;
  }
  .finale .finale-title { display: block; animation: rise .7s cubic-bezier(.2,1.4,.4,1) both; }
  .finale-title .en {
    display: block; font-size: 15px; letter-spacing: .3em; color: var(--coral-deep);
  }
  .finale-title .jp {
    display: block; font-size: clamp(30px, 9vw, 44px);
    background: linear-gradient(90deg, #ff5fb2, #ff9a3c, #ffcf4a, #7ad37a, #5fb8ff, #a77bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .finale .stage-label { display: none; }
  .finale .gecko-wrap { flex: 0 1 auto; padding-top: 22px; }
  .finale .photo { --size: min(56vw, 230px, 30dvh); }

  @media (max-height: 720px) {
    .bubble { font-size: 15px; line-height: 1.75; padding: 22px 16px 16px; min-height: 0; }
    .btn { font-size: 16px; padding: 15px 18px; }
    .summon { font-size: 18px; padding: 19px 18px; }
    .mission { font-size: 14px; padding: 10px 14px; }
    .photo { --size: min(60vw, 240px, 30dvh); }
  }
  .bubble, .actions, .stage-label, .finale-title { flex-shrink: 0; }
  #fx { position: fixed; inset: 0; z-index: 35; pointer-events: none; }
</style>
</head>
<body>
<button class="mute" id="mute" aria-label="音のオンオフ">🔊</button>

<div class="app" id="app">
  <div class="envelope-screen" id="envelope-screen">
    <div class="envelope" id="envelope" role="button" aria-label="手紙を開ける">
      <div class="body"></div>
      <div class="flap"></div>
      <div class="seal">🦎</div>
    </div>
    <div class="envelope-label">
      <div class="from">From. バンちゃん</div>
      <div class="tap"><span>タップして開けなさい！</span></div>
    </div>
  </div>

  <div class="stage-label" id="dots"><i></i><i></i><i></i><i></i></div>

  <div class="finale-title">
    <span class="en">HAPPY 25th BIRTHDAY</span>
    <span class="jp">ミク、おめでとう！</span>
  </div>

  <div class="gecko-wrap">
    <div class="photo" id="gecko" data-face="haughty" aria-label="バンちゃん">
      <div class="frame">
        <img class="shot-haughty" src="img/haughty.jpg" alt="">
        <img class="shot-proud" src="img/proud.jpg" alt="">
        <img class="shot-smug" src="img/smug.jpg" alt="">
        <img class="shot-shy" src="img/shy.jpg" alt="">
        <img class="shot-happy" src="img/happy.jpg" alt="">
      </div>
      <div class="fx" aria-hidden="true">
        <div class="say fx-haughty">ふんっ</div>
        <svg class="huff fx-haughty" viewBox="0 0 46 30"><g stroke="#8a6a55" stroke-width="3.5" stroke-linecap="round"><path d="M4 6 L22 2"/><path d="M2 15 L26 15"/><path d="M4 24 L22 28"/></g></svg>
        <div class="say fx-proud">ふふん♪</div>
        <div class="twinkle t1 fx-proud"><svg viewBox="-10 -10 20 20"><path d="M0 -10 L2.4 -2.4 L10 0 L2.4 2.4 L0 10 L-2.4 2.4 L-10 0 L-2.4 -2.4 Z" fill="#ffcf4a" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg></div><div class="twinkle t2 fx-proud"><svg viewBox="-10 -10 20 20"><path d="M0 -10 L2.4 -2.4 L10 0 L2.4 2.4 L0 10 L-2.4 2.4 L-10 0 L-2.4 -2.4 Z" fill="#ffcf4a" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg></div><div class="twinkle t3 fx-proud"><svg viewBox="-10 -10 20 20"><path d="M0 -10 L2.4 -2.4 L10 0 L2.4 2.4 L0 10 L-2.4 2.4 L-10 0 L-2.4 -2.4 Z" fill="#ffcf4a" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
        <div class="say fx-smug">ほらっ！</div>
        <div class="twinkle t1 fx-smug"><svg viewBox="-10 -10 20 20"><path d="M0 -10 L2.4 -2.4 L10 0 L2.4 2.4 L0 10 L-2.4 2.4 L-10 0 L-2.4 -2.4 Z" fill="#ffcf4a" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg></div><div class="twinkle t2 fx-smug"><svg viewBox="-10 -10 20 20"><path d="M0 -10 L2.4 -2.4 L10 0 L2.4 2.4 L0 10 L-2.4 2.4 L-10 0 L-2.4 -2.4 Z" fill="#ffcf4a" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg></div><div class="twinkle t3 fx-smug"><svg viewBox="-10 -10 20 20"><path d="M0 -10 L2.4 -2.4 L10 0 L2.4 2.4 L0 10 L-2.4 2.4 L-10 0 L-2.4 -2.4 Z" fill="#ffcf4a" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
        <div class="say fx-shy">もじもじ…</div>
        <svg class="drop fx-shy" viewBox="0 0 20 28"><path d="M10 0 C14 9 20 14 20 19 a10 9 0 0 1 -20 0 C0 14 6 9 10 0 Z" fill="#8fd3ff" stroke="#fff" stroke-width="2"/></svg>
        <svg class="blush-mark fx-shy" viewBox="0 0 40 20"><g stroke="#ff7a9a" stroke-width="3" stroke-linecap="round"><path d="M6 16 L12 4"/><path d="M16 16 L22 4"/><path d="M26 16 L32 4"/></g></svg>
        <div class="say fx-happy">やったわ！</div>
        <div class="float f1 fx-happy"><svg viewBox="0 0 20 18"><path d="M10 17 C2 11 0 7 0 4.5 C0 2 2 0 4.8 0 C7 0 8.6 1.4 10 3.4 C11.4 1.4 13 0 15.2 0 C18 0 20 2 20 4.5 C20 7 18 11 10 17 Z" fill="#ff7a9a" stroke="#fff" stroke-width="1.5"/></svg></div><div class="float f2 fx-happy"><svg viewBox="0 0 20 24"><path d="M7 19 a4 3.4 0 1 1 -1 -3 V2 L19 0 V15 a4 3.4 0 1 1 -1 -3 V5 L8 7 Z" fill="#7a6cf0" stroke="#fff" stroke-width="1.2"/></svg></div><div class="float f3 fx-happy"><svg viewBox="0 0 20 18"><path d="M10 17 C2 11 0 7 0 4.5 C0 2 2 0 4.8 0 C7 0 8.6 1.4 10 3.4 C11.4 1.4 13 0 15.2 0 C18 0 20 2 20 4.5 C20 7 18 11 10 17 Z" fill="#ff7a9a" stroke="#fff" stroke-width="1.5"/></svg></div>
      </div>
    </div>
  </div>

  <div class="bubble" id="bubble">
    <span class="name">バンちゃん</span>
    <div class="text" id="text"></div>
    <span class="more">タップで早送り ▶</span>
  </div>

  <div class="actions" id="actions"></div>
</div>

<div class="summon-layer" id="summon-layer">
  <div class="rays"></div>
  <div class="orb"></div>
  <svg class="circle" viewBox="-110 -110 220 220" aria-hidden="true">
    <defs>
      <path id="ring" d="M0,-84 A84,84 0 1,1 -0.1,-84"/>
    </defs>
    <g class="spin-a" fill="none" stroke="#ffe08a" stroke-width="2">
      <circle r="100"/><circle r="92" stroke-dasharray="4 6"/>
      <text font-size="11" font-weight="700" fill="#ffe08a" stroke="none" letter-spacing="3">
        <textPath href="#ring">HAPPY BIRTHDAY MIKU ✦ 25 ✦ HAPPY BIRTHDAY MIKU ✦ 25 ✦</textPath>
      </text>
      <circle r="74"/>
    </g>
    <g class="spin-b" fill="none" stroke="#ff9be6" stroke-width="2.5">
      <polygon points="0,-72 62,36 -62,36"/>
      <polygon points="0,72 62,-36 -62,-36"/>
      <circle r="40"/>
    </g>
    <text y="13" text-anchor="middle" font-size="36" font-weight="900" fill="#ffe08a">25</text>
  </svg>
  <div class="chant" id="chant">召喚中</div>
</div>
<div class="flash" id="flash"></div>
<div class="burst" id="burst" aria-hidden="true"><div class="wave"></div><div class="wave"></div><div class="wave"></div><div class="pillar"></div><div class="stamp">召喚成功！！</div></div>
<canvas id="fx"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<script>
(() => {
  // ---------- 台本 ----------
  const SCENES = [
    {
      face: "haughty", arms: "cross",
      text: "ふん、ミク。おかえりなさい！\n……今日も相変わらず大きな声ね、耳がキンキンしちゃうわ。\nでもまあ、今日はミクの25才の特別な誕生日だから許してあげる。\n……お誕生日おめでとう！",
      after: "next", button: "ありがとう、バンちゃん！",
    },
    {
      face: "proud", arms: "shoe",
      text: "そうそう、この前もらった白いスニーカー、ちゃんと履いてる？\nふかふかのエアで、おでかけもラクになったでしょ。\n……選んだのはワタシじゃないけど、箱の横でずっと見張ってたのはワタシなんだから。\nワタシの手柄でもあるのよ！",
      after: "next", button: "毎日履いてるよ！",
    },
    {
      face: "smug", arms: "cross",
      text: "ミク、最近モバイルバッテリーが壊れて困ってたでしょ？\nいつもミクが扉を開けると、ワタシが隠れ家から顔を出してあげてるわよね。\n今日は特別に、顔だけじゃなくて、スリムで軽〜い新しいやつも用意してあげたわ。\nケージの扉を開けて、のぞいてごらんなさい！",
      after: "cage",
    },
    {
      face: "shy", arms: "down",
      text: "ふふん、持ち運びやすくてぴったりでしょ？\n……でも、ワタシからのプレゼントはこれだけじゃないの。\n毎日お仕事がんばって疲れてるミクのために、もっとふかふかで大きな『巨大な仲間』を呼んであげたわ！\n下のボタンを押しなさい！",
      after: "summon",
    },
  ];
  const FINALE = {
    face: "happy", arms: "up",
    text: "召喚成功よ！\nこれで毎日ワタシみたいにぐっすり眠りなさい！",
  };

  const $ = (id) => document.getElementById(id);
  const app = $("app"), gecko = $("gecko"), bubble = $("bubble"), textEl = $("text"), actions = $("actions");
  const dots = [...$("dots").children];

  // ---------- 音（ファイルを使わず、その場で合成する） ----------
  let ac = null, master = null, muted = false;
  function audio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.9;
      // 派手な音を重ねても割れないように、最後に圧縮をかける
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 6;
      master.connect(comp).connect(ac.destination);
    }
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  function tone(freq, dur, { type = "sine", vol = 0.1, at = 0, to = null } = {}) {
    const c = audio(); if (!c || muted) return;
    const t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  let noiseBuf = null;
  function noise(dur, { at = 0, vol = 0.2, type = "highpass", freq = 1000, to = null, q = 0.7, attack = 0.005 } = {}) {
    const c = audio(); if (!c || muted) return;
    if (!noiseBuf) {
      noiseBuf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = c.currentTime + at;
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = noiseBuf; src.loop = true;
    f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (to) f.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(master);
    src.start(t); src.stop(t + dur + 0.05);
  }
  const sfx = {
    blip() { tone(820 + Math.random() * 260, 0.045, { type: "square", vol: 0.025 }); },
    pop()  { tone(420, 0.14, { vol: 0.18, to: 980 }); },
    open() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, { type: "triangle", vol: 0.12, at: i * 0.07 })); },
    sparkle() { [1568, 2093, 2637, 3136].forEach((f, i) => tone(f, 0.18, { type: "triangle", vol: 0.06, at: i * 0.06 })); },
    riser(sec) {
      const c = audio(); if (!c || muted) return;
      const t = c.currentTime;
      const g = c.createGain(), f = c.createBiquadFilter();
      f.type = "lowpass"; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(5000, t + sec);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + sec * 0.9); g.gain.exponentialRampToValueAtTime(0.0001, t + sec + 0.1);
      f.connect(g).connect(master);
      [0, 7, -5].forEach((detune) => {
        const o = c.createOscillator();
        o.type = "sawtooth"; o.detune.value = detune * 10;
        o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(880, t + sec);
        o.connect(f); o.start(t); o.stop(t + sec + 0.15);
      });
    },
    // 溜め：うなりが上がっていき、刻みがだんだん速くなり、鼓動が重なる
    charge(sec) {
      this.riser(sec);
      noise(sec, { type: "bandpass", freq: 300, to: 6000, q: 1.2, vol: 0.12, attack: sec * 0.9 });
      let t = 0, gap = 0.32, k = 0;
      while (t < sec - 0.05) {
        tone(600 + k * 45, 0.05, { type: "square", vol: 0.035 + k * 0.002, at: t });
        t += gap; gap = Math.max(0.045, gap * 0.86); k++;
      }
      [0, 0.9, 1.6, 2.2, 2.7, 3.1, 3.4, 3.6].forEach((b) => { if (b < sec) tone(70, 0.25, { vol: 0.35, at: b, to: 40 }); });
    },
    // 爆発：低いドーンとシンバル
    impact() {
      tone(110, 1.2, { vol: 0.6, to: 30 });
      tone(55, 1.6, { type: "triangle", vol: 0.4, to: 28 });
      noise(2.2, { type: "highpass", freq: 2500, vol: 0.28 });
      noise(0.5, { type: "lowpass", freq: 900, vol: 0.4 });
      [2093, 2637, 3136, 4186].forEach((f, i) => tone(f, 1.2, { type: "triangle", vol: 0.04, at: 0.05 + i * 0.04 }));
    },
    // 花火：ポンと上がって、パチパチ
    firework(at = 0) {
      tone(300, 0.35, { vol: 0.12, at, to: 1400 });
      noise(0.25, { type: "bandpass", freq: 1800, q: 0.8, vol: 0.35, at: at + 0.35 });
      for (let i = 0; i < 10; i++) noise(0.03, { type: "highpass", freq: 4000, vol: 0.12, at: at + 0.45 + Math.random() * 0.7 });
    },
    fanfare() {
      const N = { G4: 392, C5: 523.3, E5: 659.3, G5: 784, A5: 880, B5: 987.8, C6: 1046.5, D6: 1174.7, E6: 1318.5 };
      const lead = (f, at, dur) => { tone(f, dur, { type: "square", vol: 0.09, at }); tone(f, dur, { type: "triangle", vol: 0.14, at }); };
      lead(N.G4, 0.00, 0.12); lead(N.G4, 0.14, 0.12); lead(N.G4, 0.28, 0.12);
      lead(N.C5, 0.42, 0.55);
      lead(N.E5, 1.00, 0.16); lead(N.G5, 1.18, 0.16); lead(N.C6, 1.36, 0.9);
      [N.C5, N.E5, N.G5, N.C6].forEach((f) => tone(f, 1.6, { type: "triangle", vol: 0.07, at: 1.36 }));
      [N.E6, N.D6, N.C6, N.E6].forEach((f, i) => tone(f, 0.2, { type: "triangle", vol: 0.05, at: 2.4 + i * 0.12 }));
      // ブラスの和音とティンパニで厚くする
      const brass = (f, at, dur, vol = 0.05) => { tone(f, dur, { type: "sawtooth", vol, at }); tone(f * 1.003, dur, { type: "sawtooth", vol: vol * 0.7, at }); };
      [[0.42, [261.6, 329.6, 392]], [1.36, [261.6, 329.6, 392, 523.3]], [2.0, [349.2, 440, 523.3]], [2.4, [392, 493.9, 587.3]], [2.9, [261.6, 329.6, 392, 523.3, 659.3]]]
        .forEach(([at, ch]) => ch.forEach((f) => brass(f, at, at === 2.9 ? 1.8 : 0.5)));
      [0, 0.14, 0.28, 0.42, 1.36, 2.9].forEach((at) => { tone(98, 0.45, { vol: 0.3, at, to: 70 }); noise(0.12, { type: "lowpass", freq: 600, vol: 0.18, at }); });
      for (let i = 0; i < 14; i++) noise(0.05, { type: "bandpass", freq: 1500, vol: 0.06 + i * 0.008, at: 2.2 + i * 0.05 });
      [1046.5, 1318.5, 1568, 2093, 2637, 3136].forEach((f, i) => tone(f, 0.5, { type: "triangle", vol: 0.05, at: 3.0 + i * 0.06 }));
    },
  };
  $("mute").addEventListener("click", () => {
    muted = !muted;
    $("mute").textContent = muted ? "🔇" : "🔊";
  });

  // ---------- 文字送り ----------
  let typing = null;
  function say(text) {
    return new Promise((resolve) => {
      if (typing) typing.finish();
      textEl.textContent = "";
      bubble.classList.add("typing");
      const caret = document.createElement("span"); caret.className = "caret";
      textEl.appendChild(caret);
      const chars = [...text];
      let i = 0, timer = null, done = false;
      const finish = () => {
        if (done) return; done = true;
        clearTimeout(timer);
        textEl.textContent = text;
        bubble.classList.remove("typing");
        typing = null;
        resolve();
      };
      const step = () => {
        if (i >= chars.length) return finish();
        const ch = chars[i++];
        caret.before(ch);
        if (i % 2 === 0 && !/\s/.test(ch)) sfx.blip();
        let wait = 42;
        if ("。！？".includes(ch)) wait = 320;
        else if (ch === "…") wait = 140;
        else if ("、\n".includes(ch)) wait = 180;
        timer = setTimeout(step, wait);
      };
      typing = { finish };
      step();
    });
  }
  bubble.addEventListener("click", () => typing && typing.finish());

  // ---------- 画面 ----------
  function setGecko(face) {
    gecko.dataset.face = face;
    gecko.classList.remove("pop"); void gecko.getBoundingClientRect(); gecko.classList.add("pop");
    // 効果の文字を出し直す
    gecko.querySelectorAll(".say").forEach((el) => { el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; });
  }
  function clearActions() { actions.innerHTML = ""; }
  function button(label, onClick, cls = "") {
    const b = document.createElement("button");
    b.className = "btn " + cls; b.textContent = label;
    b.addEventListener("click", () => { if (b.disabled) return; b.disabled = true; onClick(); }, { once: true });
    actions.appendChild(b);
    return b;
  }

  async function play(n) {
    const s = SCENES[n];
    dots.forEach((d, i) => d.classList.toggle("on", i <= n));
    clearActions();
    setGecko(s.face);
    await say(s.text);
    if (s.after === "next") {
      button(s.button, () => { sfx.pop(); play(n + 1); });
    } else if (s.after === "cage") {
      const m = document.createElement("div");
      m.className = "mission";
      m.innerHTML = "<b>REAL MISSION</b>ケージの扉を開けて、中を確認してね！<br><small>バンちゃんが驚かないように、そーっとね。</small>";
      actions.appendChild(m);
      sfx.sparkle();
      button("充電器見つけた！", () => { sfx.pop(); play(n + 1); });
    } else if (s.after === "summon") {
      sfx.sparkle();
      button("🦎 ハグモッチを召喚する！", summon, "summon");
    }
  }

  // ---------- 召喚 ----------
  const CHARGE_SEC = 3.8;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  async function summon() {
    clearActions();
    const layer = $("summon-layer"), chant = $("chant");
    layer.classList.add("on");
    sfx.charge(CHARGE_SEC);
    if (navigator.vibrate) navigator.vibrate([40, 120, 40, 120, 60, 90, 80, 60, 100, 40, 140]);

    // 光の粒が魔法陣に吸い込まれていく（だんだん激しく）
    const fx = window.confetti ? confetti.create($("fx"), { resize: true, useWorker: true }) : null;
    let n = 0;
    const gather = setInterval(() => {
      n++;
      chant.textContent = n > 12 ? "来る……！" : "召喚中" + "・".repeat(n % 4);
      if (fx) fx({
        particleCount: 4 + n, startVelocity: 18 + n * 1.5, spread: 360, ticks: 60, gravity: 0, scalar: .7 + n * .02,
        shapes: ["star", "circle"], colors: ["#ffe08a", "#ff9be6", "#9fe3ff", "#ffffff"],
        origin: { x: Math.random(), y: Math.random() < .5 ? 0 : 1 },
      });
    }, 220);
    await wait(CHARGE_SEC * 1000 * 0.5);
    app.classList.add("shake"); layer.classList.add("shake");
    await wait(CHARGE_SEC * 1000 * 0.28);
    app.classList.replace("shake", "shake-hard"); layer.classList.replace("shake", "shake-hard");
    await wait(CHARGE_SEC * 1000 * 0.22);
    clearInterval(gather);

    // 光の柱と衝撃波、「召喚成功！！」、そしてファンファーレ（ボタンから約4秒）
    $("flash").classList.add("go");
    $("burst").classList.add("go");
    sfx.impact();
    sfx.fanfare();
    if (navigator.vibrate) navigator.vibrate([300, 80, 120]);
    app.classList.remove("shake-hard"); layer.classList.remove("shake-hard");
    layer.classList.remove("on");
    app.classList.add("finale");
    celebrate(fx);

    setGecko(FINALE.face);
    await wait(1800);
    await say(FINALE.text);
    const r = document.createElement("button");
    r.className = "replay"; r.textContent = "もう一度はじめから";
    r.addEventListener("click", () => location.reload());
    actions.appendChild(r);
  }

  function celebrate(fx) {
    if (!fx) return;
    const colors = ["#ff5fb2", "#ff9a3c", "#ffcf4a", "#7ad37a", "#5fb8ff", "#a77bff"];
    fx({ particleCount: 260, spread: 360, startVelocity: 60, origin: { x: .5, y: .5 }, colors, shapes: ["star", "circle", "square"], scalar: 1.2 });
    setTimeout(() => fx({ particleCount: 150, angle: 60, spread: 70, startVelocity: 70, origin: { x: 0, y: .85 }, colors }), 300);
    setTimeout(() => fx({ particleCount: 150, angle: 120, spread: 70, startVelocity: 70, origin: { x: 1, y: .85 }, colors }), 300);
    // 花火を5発。上がる音から少し遅れて開く
    [1.2, 1.9, 2.6, 3.4, 4.3].forEach((sec, i) => {
      sfx.firework(sec - 0.35);
      setTimeout(() => fx({ particleCount: 90, spread: 360, startVelocity: 32, gravity: .7, ticks: 140, scalar: .9,
        origin: { x: [.25, .75, .5, .2, .8][i], y: [.25, .2, .15, .3, .3][i] }, colors: [colors[i], colors[(i + 2) % 6], "#ffffff"], shapes: ["star", "circle"] }), sec * 1000);
    });
    const end = Date.now() + 9000;
    (function rain() {
      fx({ particleCount: 3, startVelocity: 0, ticks: 320, gravity: .55, spread: 30,
           origin: { x: Math.random(), y: -0.05 }, colors, scalar: 1.1 });
      if (Date.now() < end) requestAnimationFrame(rain);
    })();
  }

  // ---------- 開封 ----------
  const env = $("envelope"), envScreen = $("envelope-screen");
  function openLetter() {
    audio();
    sfx.open();
    env.classList.add("open");
    setTimeout(() => {
      envScreen.classList.add("gone");
      setTimeout(() => { envScreen.remove(); play(0); }, 500);
    }, 450);
  }
  envScreen.addEventListener("click", openLetter, { once: true });
})();
</script>
